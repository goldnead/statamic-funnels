<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FACC15"/>
      <stop offset="1" stop-color="#A16207"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#A16207" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- a funnel, and the drop that came through it. The obvious glyph is the
       right one here: nothing else says "narrowing" in a single silhouette. -->
  <g filter="url(#sh)">
    <path d="M104 118 A24 24 0 0 1 128 94 L384 94 A24 24 0 0 1 408 118 L408 138 A24 24 0 0 1 401 155 L302 254 L302 372 A24 24 0 0 1 289 393 L223 426 A24 24 0 0 1 210 405 L210 254 L111 155 A24 24 0 0 1 104 138 Z" fill="#FFFFFF"/>
  </g>
</svg>
